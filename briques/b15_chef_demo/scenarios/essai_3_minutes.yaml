# Scénario d'essai de trois minutes (brique 15). Testé sur faux robot (faux humanoïde), cerveau à règles.
# Jouer :      python3 lancer.py scenario essai_3_minutes.yaml
# Répéter :    python3 lancer.py scenario essai_3_minutes.yaml --repetition --panne robot@7 --acceleration 20
# Les pauses (pause_apres_s) laissent le temps à la personne qui présente de parler et au public de lire.
# Les limites et les pauses sont des choix d'écriture, pas des mesures. Mesuré une fois à ×1 (11.11.2026, Linux,
# faux robot, cerveau à règles, sans panne) : 174,81 s. Avec Apertus sur les Mac : à mesurer.

titre: Essai de trois minutes — faux humanoïde
description: >
  Accueil en quatre langues, aller à la table, un ordre dangereux refusé et expliqué, un ordre flou qui donne
  une question, prendre la bouteille avec confirmation, un « stop » en route, l'état, puis la fiche de vérité.
robot: humanoide
duree_visee_s: 180
langue: fr
duree_max_s: 20
plan_b: [tablette, mode_local, main_humaine, sauter]

etapes:
  - nom: bienvenue
    annonce: {texte: "Bonjour et bienvenue au Leukerbad Robot Carnival ! Le robot va vous saluer dans quatre langues.", langue: fr}
    pause_apres_s: 15

  - nom: salut_fr
    dire: {texte: "Salue", langue: fr}
    attendu: {action: rejouer_geste, parametres: {nom: saluer}}
    pause_apres_s: 6

  - nom: salut_gsw
    dire: {texte: "Grüezi", langue: gsw}
    attendu: {action: rejouer_geste, parametres: {nom: saluer}}
    remarque: Le robot comprend le suisse allemand, répond en allemand, et le dit une fois.
    pause_apres_s: 7

  - nom: salut_en
    dire: {texte: "Wave", langue: en}
    attendu: {action: rejouer_geste, parametres: {nom: saluer}}
    pause_apres_s: 6

  - nom: salut_zh
    dire: {texte: "挥手", langue: zh}
    attendu: {action: rejouer_geste, parametres: {nom: saluer}}
    pause_apres_s: 6

  - nom: annonce_deplacement
    annonce: "Maintenant, le robot va jusqu'à la table."
    pause_apres_s: 6

  - nom: aller_table
    dire: {texte: "Va à la table", langue: fr}
    attendu: {action: se_deplacer, parametres: {lieu: table}}
    duree_max_s: 30
    remarque: Environ 4,5 m à 0,3 m/s (limite de sécurité par défaut), d'après le plan du monde (commun/monde.yaml).
    pause_apres_s: 5

  - nom: annonce_danger
    annonce: "Et si on lui demande d'aller beaucoup trop vite ?"
    pause_apres_s: 6

  - nom: ordre_dangereux
    dire: {texte: "Va à la scène à 5 mètres par seconde", langue: fr}
    attendu: refus
    remarque: Le gardien refuse et le robot explique la limite de sécurité. Le robot ne bouge pas.
    pause_apres_s: 10

  - nom: annonce_flou
    annonce: "Et si l'ordre n'est pas clair ?"
    pause_apres_s: 6

  - nom: ordre_flou
    dire: {texte: "Va", langue: fr}
    attendu: question
    remarque: Le robot ne devine pas, il demande « Où dois-je aller ? ».
    pause_apres_s: 10

  - nom: annonce_objet
    annonce: "Pour prendre un objet, le robot demande toujours confirmation."
    pause_apres_s: 6

  - nom: prendre_bouteille
    dire: {texte: "Prends la bouteille", langue: fr}
    attendu: {genre: confirmation, action: saisir}
    remarque: Le « oui » doit venir dans les 20 secondes (réglage de la chaîne), d'où une pause courte.
    pause_apres_s: 4

  - nom: confirmer_oui
    dire: {texte: "Oui", langue: fr}
    attendu: {action: saisir, parametres: {objet: bouteille}}
    pause_apres_s: 6

  - nom: annonce_stop
    annonce: "Le robot porte la bouteille vers la scène. On va l'arrêter en route."
    pause_apres_s: 5

  - nom: aller_scene
    dire: {texte: "Va à la scène", langue: fr}
    attendu: {action: se_deplacer, statut: demarree, parametres: {lieu: scene}}
    attendre_fin: false
    remarque: Le chef n'attend pas la fin du trajet, pour pouvoir dire « stop » pendant qu'il marche.

  - nom: en_route
    attendre_s: 3

  - nom: stop
    dire: {texte: "Stop", langue: fr}
    attendu: {action: arreter}
    pause_apres_s: 6

  - nom: etat
    dire: {texte: "Batterie ?", langue: fr}
    attendu: {action: etat}
    pause_apres_s: 6

  - nom: fiche_de_verite
    fiche: fr
    pause_apres_s: 25

  - nom: merci
    annonce: "Merci ! La fiche de vérité dit ce qui a été testé, et sur quel robot."
    pause_apres_s: 8
