# PRÉPARÉE SANS LE ROBOT — non testé sur vrai robot. Carte d'identité préparée d'avance (clinique en boîte, avenant 3, M01) : « Unitree G1-D », deux bras sur une base à roues.
# Personne de l'équipe n'a vu ce robot. Seule une personne de l'équipe enlève la marque, en écrivant la date où le
# vrai robot a été vu. Les chiffres viennent de l'avenant de Hiba, ou sont des choix pour le FAUX ROBOT : tous à vérifier.
# Le format est celui des autres cartes ; ce qui n'a pas de place dans le format est dans « remarques ».
id: faux-unitree-g1d
nom: Unitree G1-D (carte préparée sans le robot)
genre: roues
fabricant: Unitree (carte préparée sans le robot)
modele: G1-D
vrai_robot: false
capacites: [se_deplacer, saisir, poser, arreter, etat]
limites:
  vitesse_max_m_s: 0.2   # il roule très lentement : un choix de prudence, pas un chiffre du fabricant ; à vérifier samedi
  portee_max_m: 0.6   # pour le faux robot seulement ; à remplir samedi
  charge_max_kg: 3.0   # environ, par bras, selon l'avenant ; à vérifier samedi
  force_max_n: 15   # pour le faux robot seulement ; à remplir samedi
gestes: []
remarques: >-
  PRÉPARÉE SANS LE ROBOT — non testé sur vrai robot.
  Unitree G1-D : deux bras sur une base à roues.
  Poids : environ 80 kg avec sa base à roues.
  Hauteur : d'environ 1,3 m à environ 1,7 m.
  Chaque bras porte environ 3 kg.
  Il atteint environ 2 m de haut.
  Sa base peut rouler vite.
  Mains ou pinces, batterie : à remplir samedi.
  Limites pour la démonstration : il roule très lentement ; au moins 1 m entre lui et toute personne ;
  il pose l'objet sur une table, il ne le donne pas de la main à la main ; pas d'escalier ; jamais sans une personne à l'arrêt.
  Pour le faux robot seulement : on fait comme s'il pouvait saisir un objet léger.
  Voix, écoute, gestes : à remplir samedi.
  Version : il faut peut-être la version faite pour les développeurs : à vérifier samedi.
