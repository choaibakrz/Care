# DONNÉES INVENTÉES — DÉMONSTRATION. Les mots qui font reconnaître un point de liste À LA VOIX, en allemand, italien et
# anglais (cahier 5.5, tâche T16). Les mots français sont dans le faux dossier (listes_de_soin.yaml, « mots »).
# Écrits par l'agent, PAS RELUS par quelqu'un qui parle la langue. Un mot = un mot entier dans la phrase entendue.
marque: inventé
# Le mot qui dit « c'est fait », dans chaque langue. Sans lui, rien n'est coché.
