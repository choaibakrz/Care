    liaison_perdue: "Je n'ai plus de liaison avec le robot."
    robot_refuse: "Le robot refuse."
    delai_depasse: "Le robot ne répond pas."
    regle_gardien: "Une règle de sécurité l'interdit."
    zone_interdite: "Je n'ai pas le droit d'aller là : {zone}."
