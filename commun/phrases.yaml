    saisir: "Je prends : {objet}."
    poser: "Je pose l'objet."
    montrer: "Je montre : {cible}."
    rejouer_geste: "Je fais le geste : {geste}."
    arreter: "Je m'arrête."
    etat: "Voici mon état."
  je_vous_ecoute: "Je vous écoute."
  confirmer: "{annonce} Vous confirmez ?"
  confirmation_annulee: "D'accord, je ne fais rien."
  fait: "C'est fait."
  echec: "Je n'ai pas réussi : {message}."
