  etat: "Batterie : {batterie} %. {erreurs}"
  incompris: "Je n'ai pas compris. Pouvez-vous répéter ?"
  question_chiffre: "Je ne suis pas sûr du chiffre. Pouvez-vous le redire ?"
  question_sens: "Dans quel sens, et de combien de mètres ?"
  sens: {avant: "en avant", arriere: "en arrière", gauche: "vers la gauche", droite: "vers la droite"}
  question_lieu: "Où dois-je aller ?"
  question_objet: "Quel objet ?"
  question_choix: "Vous voulez dire : {options} ?"
  question_pas_vu: "Je ne vois pas : {options}. Pouvez-vous me montrer où c'est ?"   # brique 5 (les yeux)
