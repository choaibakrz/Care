# Les phrases du robot, dans chaque langue. Mots simples, phrases courtes.
# Ajouter une langue : copier le bloc "fr", traduire, et ajouter la langue dans commun/langues.yaml.
# {lieu}, {objet}, {geste}... sont remplacés automatiquement.

