[workspace]
resolver = "3"
members = [
    ".",
    "crates/domain",
    "crates/storage",
    "crates/realtime",
    "crates/security",
    "crates/locations",
    "crates/optimization",
    "crates/scheduler",
    "crates/audit",
    "crates/python-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace crates
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
realtime = { path = "crates/realtime" }
security = { path = "crates/security" }
locations = { path = "crates/locations" }
optimization = { path = "crates/optimization" }
scheduler = { path = "crates/scheduler" }
audit = { path = "crates/audit" }
python-bindings = { path = "crates/python-bindings" }
# Third party (versions resolved by `cargo add` on 2026-11-14)
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
governor = "0.10.4"
# Pseudonymous accounts (Task A7): RustCrypto, MIT OR Apache-2.0. `pbkdf2` is the reference
# derivation of the account key (clients derive it themselves), `hmac` + `sha2` the pepper
# HMAC that turns a key into an account id.
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.1"
# Unicode NFC of the user name and password before the account key derivation (ruling R25):
# MIT OR Apache-2.0, already in the lock file through sqlx.
unicode-normalization = "0.1.26"
# OS randomness for the journal signing key, the pepper, tokens and enrolment codes (step R1):
# MIT OR Apache-2.0, already in the lock file through uuid.
getrandom = "0.3.4"
ipnet = { version = "2.12.2", features = ["serde"] }
pyo3 = "0.30.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
# WebSocket client of the `fake_robot` binary (Task 5) and of the tests; both already in the
# lock file through axum and sqlx.
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
# HTTP/1 client of the main server to the clinic-brain process on localhost (Task A6); all
# three are already in the lock file through axum (MIT).
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
# HACKATHON: self-signed certificate. Optional HTTPS listener (phones only give the
# microphone to https pages). `ring` crypto only (aws-lc-rs carries the OpenSSL licence):
# rustls, axum-server and rcgen all set to `ring`; if-addrs lists the LAN addresses for the
# certificate's names.
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
if-addrs = "0.15.0"
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace", "catch-panic"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

# The account key derivation (Task A7) runs 600 000 SHA-256 rounds: optimised even in debug
# builds so the test vector and the `--mock` compatibility login take well under a second.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }

[package]
name = "clinic-server"
# `cargo run` starts the server; the fake robot is `cargo run --bin fake_robot`; the brain
# process is `cargo run --bin clinic-brain` (add `--features python` for the real models).
default-run = "clinic-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain.workspace = true
storage.workspace = true
realtime.workspace = true
security.workspace = true
locations.workspace = true
optimization.workspace = true
scheduler.workspace = true
audit.workspace = true
python-bindings.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
# Enrolment codes (step R1).
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Task A8: EMERGENCY_SERVICE_ADDRESSES (addresses and CIDR blocks never limited or blocked).
ipnet.workspace = true
# HACKATHON: self-signed certificate (optional HTTPS listener, `src/tls.rs`).
axum-server.workspace = true
rustls.workspace = true
rcgen.workspace = true
if-addrs.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
uuid.workspace = true

[features]
# Off by default: `clinic-brain` then runs without Python and refuses every call with 503
# `brain_unavailable` (Task A6). `--features python` embeds the interpreter (pyo3).
python = ["python-bindings/python"]

[[bin]]
name = "clinic-brain"
path = "src/bin/clinic_brain.rs"

[dev-dependencies]
domain = { workspace = true, features = ["testing"] }
sqlx.workspace = true
