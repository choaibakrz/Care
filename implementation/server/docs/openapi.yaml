  "components": {
    "schemas": {
      "AccountKey": {
        "type": "string",
        "format": "hex",
        "description": "The key a client derives from user name, password and clinic, sent at login and at\nenrolment. Password-equivalent: never stored, logged, journaled or echoed. `Debug` prints\n`AccountKey(***)`; there is no `Display`, no `Serialize`, no `PartialEq` (compare\naccount ids, in constant time, instead) and no `Clone` (a key is read once from a request\nand turned into an account id; no copy of it lingers).\n\nWire form: 64 lowercase hex characters.",
        "maxLength": 64,
        "minLength": 64,
        "pattern": "^[0-9a-f]{64}$"
      },
      "AccountTag": {
        "type": "string",
        "description": "The first 6 lowercase hex digits of an [`AccountId`]: shown next to the pseudonym so two\n\"Nurse 7\" can be told apart, and used by the admin to disable an account\n(`DELETE /admin/accounts/{account_tag}`). Not unique by construction (24 bits): the\nadmin routes answer 409 `ambiguous_account_tag` when two accounts share one.",
        "pattern": "^[0-9a-f]{6}$"
      },
      "AccountView": {
        "type": "object",
        "description": "One account in `GET /admin/accounts` (admin, Task A7): what the server knows of it, which\nis nothing that names a person.",
        "required": [
          "account_tag",
          "display_label",
          "role",
          "created_at",
          "disabled"
        ],
        "properties": {
          "account_tag": {
            "$ref": "#/components/schemas/AccountTag",
            "description": "The first 6 hex digits of the account id (what `DELETE /admin/accounts/{tag}` takes)."
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "Enrolment time."
          },
          "disabled": {
            "type": "boolean",
            "description": "Whether it is disabled."
          },
          "display_label": {
            "$ref": "#/components/schemas/OwnerLabel",
            "description": "The pseudonym."
          },
          "role": {
            "$ref": "#/components/schemas/Role",
            "description": "Role."
          }
        }
      },
      "AdjustRequest": {
        "type": "object",
        "description": "`POST /inventory/{item}/adjust`. The admin console sends only `delta`.",
        "required": [
          "delta"
        ],
        "properties": {
          "delta": {
            "type": "integer",
            "format": "int32",
            "description": "Change, a non-zero integer (negative removes)."
          },
          "reason": {
            "$ref": "#/components/schemas/StockAdjustReason",
            "description": "Why (default `admin_correction`)."
          }
        },
        "additionalProperties": false
      },
      "AlarmLevel": {
        "type": "string",
        "description": "Alarm level mirrored from the emergency service.",
        "enum": [
          "call",
          "urgent",
          "emergency"
        ]
      },
      "AnchorId": {
        "type": "string",
        "description": "Id of an anchor as advertised over BLE."
      },
      "AppErrorCode": {
        "type": "string",
        "description": "Tablet application error codes (closed list; an unknown code is 422).",
        "enum": [
          "crash",
          "network_lost",
          "bluetooth_off",
          "camera_unavailable",
          "storage_full"
        ]
      },
      "AssignTabletRequest": {
        "type": "object",
        "description": "`POST /devices/{id}/assign` (admin): hand a free, connected tablet to a staff member\n(pseudonym) or a bed.",
        "required": [
          "kind",
          "label"
        ],
        "properties": {
          "kind": {
            "$ref": "#/components/schemas/TabletKind",
            "description": "`staff` or `bedside`."
          },
          "label": {
            "type": "string",
            "description": "A staff pseudonym (\"Dr. C\") or a bed (\"Bed 12\"): 1 to 40 characters, not digits only.\nNever a patient's name."
          },
          "place": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/PlaceId",
                "description": "The bed's patient room (required for bedside); for staff, `null` keeps the tablet\nwhere it is."
              },
              {
                "type": "null"
              }
            ]
          },
          "speciality": {
            "type": [
              "string",
              "null"
            ],
            "description": "Staff only (\"Neurology\"); must be `null` for a bedside tablet."
          }
        },
        "additionalProperties": false
      },
      "AuditEntry": {
