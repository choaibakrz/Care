    },
    "/clinics/{id}": {
      "get": {
        "tags": [
          "clinics"
        ],
        "summary": "One plan, as a document that `POST /clinics` and `PUT /clinics/{id}` accept back.",
        "operationId": "get",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "Clinic plan id",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The plan; `ETag` is its version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClinicPlan"
                }
              }
            }
          },
          "403": {
            "description": "Admin only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "404": {
            "description": "No such plan",
            "content": {
