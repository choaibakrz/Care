    "/robots/{id}/commands/{command_id}/revert": {
      "post": {
        "tags": [
          "robots"
        ],
        "summary": "Reverts a robot command a non-admin sent (admin, Task A7): sends the inverse command\n(`pause` -> `resume`, `resume` -> `pause`, `dock` -> `resume`) and journals the revert. An\nemergency stop is admin-only and never revertible this way; a shutdown (admin only)\ncannot be undone from the server. Only the robot's latest command can be reverted (409\n`superseded` otherwise); nothing is reverted on a robot in `estop` (409 `estop_latched`:\nthe admin re-arms it with an explicit `resume`); two concurrent reverts of one command\nsend one inverse (the other is 409 `already_reverted`).",
        "operationId": "revert",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "Robot id",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "command_id",
