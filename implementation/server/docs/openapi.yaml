            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Inverse command sent",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RevertReceipt"
                }
              }
            }
          },
          "403": {
