    "/clinics": {
      "get": {
        "tags": [
          "clinics"
        ],
        "summary": "Every stored plan with its version and the active marker.",
        "operationId": "list",
        "responses": {
          "200": {
            "description": "Stored plans",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/ClinicSummary"
                  }
                }
              }
            }
          },
          "403": {
            "description": "Admin only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      },
      "post": {
        "tags": [
          "clinics"
        ],
        "summary": "Stores a new plan (validated as a whole; version 1, not active). The id is derived from\nthe name; a name whose id is taken is 409 `clinic_exists`.",
        "operationId": "create",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ClinicPlan"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Plan stored; `ETag` is its version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClinicSummary"
                }
              }
            }
          },
          "403": {
            "description": "Admin only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "409": {
            "description": "A plan with the id derived from this name exists (code `clinic_exists`); rename the plan",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Invalid plan (code `invalid_plan`, every problem in `error.details`)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
