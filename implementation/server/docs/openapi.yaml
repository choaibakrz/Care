{
  "openapi": "3.1.0",
  "info": {
    "title": "Iris · Care backend",
    "description": "Contract C3. Errors are always `{ \"error\": { \"code\", \"message\" } }`, plus `details: [{path, problem}]` when a whole document was checked. All data in this project is invented.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    },
    "version": "0.1.0"
  },
  "paths": {
    "/admin/accounts": {
      "get": {
        "tags": [
          "accounts"
        ],
        "summary": "Every account: pseudonym, tag, role, creation time, disabled (admin). No user name exists.",
        "operationId": "list_accounts",
        "responses": {
          "200": {
            "description": "Accounts",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/AccountView"
                  }
                }
              }
            }
          },
          "403": {
            "description": "Permission missing",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/admin/accounts/{account_tag}": {
      "delete": {
        "tags": [
          "accounts"
        ],
        "summary": "Disables an account by its tag and revokes its tokens (admin). A forgotten password is\nhandled this way: disable, then issue a new enrolment code.",
        "operationId": "disable_account",
        "parameters": [
          {
            "name": "account_tag",
            "in": "path",
            "description": "The account's 6 hex digit tag",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Disabled"
          },
          "403": {
            "description": "Permission missing",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "404": {
            "description": "No such account",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "409": {
            "description": "`ambiguous_account_tag` or `cannot_disable_self`",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Not a tag",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/admin/enrolment-codes": {
      "post": {
        "tags": [
          "accounts"
        ],
        "summary": "Issues a one-time enrolment code for a role (admin). The code is shown once; it works for\n24 h and only its HMAC is kept.",
        "operationId": "issue_enrolment_code",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EnrolmentCodeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Code issued",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrolmentCodeView"
                }
              }
            }
          },
          "403": {
            "description": "Permission missing",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Malformed request, or role `robot`",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/audit": {
      "get": {
        "tags": [
          "audit"
        ],
        "summary": "Audit rows `{items, next}` filtered by time, actor and category; `limit` 1 to 500.",
        "operationId": "list",
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "description": "From (inclusive).",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "description": "To (exclusive).",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "actor",
            "in": "query",
            "description": "The actor exactly as audit rows show it (an owner label, `robot:<id>` or\n`system:<name>`): the admin console filters by a value taken from a row. Task 9\nresolves an owner label to the matching user(s); a user id is not accepted here.",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "category",
            "in": "query",
            "description": "Category (`audit`, `security`, `robot`, `system`, `incident`, `seal`).",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "description": "Page size, 1 to 500 (default 100).",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "minimum": 0
            }
          },
          {
            "name": "after",
            "in": "query",
            "description": "Continue after this sequence number.",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of audit records",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuditPageView"
                }
              }
            }
          },
          "403": {
            "description": "Admin only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Invalid filter or limit above 500",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/audit/integrity": {
      "get": {
        "tags": [
          "audit"
        ],
        "summary": "The last journal verification report (chain, seals, anchors, torn tail).",
        "operationId": "integrity",
        "responses": {
          "200": {
            "description": "Last verification report",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VerifyReport"
                }
              }
            }
          },
          "403": {
            "description": "Admin only",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/auth/derivation": {
      "get": {
        "tags": [
          "auth"
        ],
        "summary": "How a client derives its account key: algorithm, iterations, key length and this server's\naccount clinic id (the salt is `clinic:<clinic_id>:<lowercase username>`). Public.",
        "operationId": "derivation",
        "responses": {
          "200": {
            "description": "Derivation parameters",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/KeyDerivationParams"
                }
              }
            }
          }
        }
      }
    },
    "/auth/enrol": {
      "post": {
        "tags": [
          "auth"
        ],
        "summary": "Enrols with a one-time code from an admin, the derived key of the user name and password\nthe person chose on their device, and a pseudonym. Public (the code is the credential).",
        "operationId": "enrol",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EnrolRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Account created; log in with the same key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnrolledView"
                }
              }
            }
          },
          "403": {
            "description": "`enrolment_refused`: unknown, used or expired code",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "409": {
            "description": "`account_exists`: these credentials are already an account",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Malformed request (key, code or pseudonym)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "429": {
            "description": "Too many attempts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "tags": [
          "auth"
        ],
        "summary": "Logs in with the account key the client derived (`{account_key, device_id?}`); returns a\nbearer token, bound to `device_id` when the client sent one (a browser sends none).",
        "description": "An unknown key (a wrong user name or password gives one), and a disabled account, get the\nsame answer (\"User name or password is incorrect.\"). A `{username, password}` body is 422\n`key_derivation_required`: the server never takes them (only `--mock` still accepts them,\nuntil frontend task F9).",
        "operationId": "login",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Logged in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "401": {
            "description": "User name or password is incorrect",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "Malformed request, or `key_derivation_required` for a user name and password body",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "429": {
            "description": "Too many attempts",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        }
      }
    },
    "/brain/health": {
      "get": {
        "tags": [
          "brain"
        ],
        "summary": "Asks the brain now: `up`, `degraded` (fallback only) or `down` with the reason, the models\nloaded and the queue length. Always 200.",
        "operationId": "health",
        "responses": {
          "200": {
            "description": "The brain's health",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BrainHealth"
                }
              }
            }
          },
          "403": {
            "description": "Staff roles only (use_brain)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/brain/report": {
      "post": {
        "tags": [
          "brain"
        ],
        "summary": "Drafts a shift, incident or robot activity report of a period from server data the caller\nmay see (tasks, incidents, robot activity). No audio and no free text from patients.",
        "operationId": "report",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReportRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Report draft, every line with its server source",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReportDraft"
                }
              }
            }
          },
          "403": {
            "description": "Admin and doctor only (draft_report)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "413": {
            "description": "Body over 1 MiB (body_too_large)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "422": {
            "description": "`to` not after `from`, or a period longer than 7 days",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "503": {
            "description": "The brain is down or busy",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "504": {
            "description": "The brain did not answer in time",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/brain/simplify": {
      "post": {
        "tags": [
          "brain"
        ],
        "summary": "Rewrites a text in plain language for a patient, in the same language. Never adds\nmedical advice; when the rewrite fails its check against the source, `simplified` is\n`false` and the original text comes back (\"could not simplify safely\").",
        "operationId": "simplify",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SimplifyRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Simplification draft",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimplifyResult"
                }
              }
            }
          },
          "403": {
            "description": "Staff roles only (use_brain)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
