            "description": "Refusals of the window by reason."
          },
          "step_s": {
            "type": "integer",
            "format": "int32",
            "description": "Seconds between points (always 1).",
            "minimum": 0
          }
        }
      },
      "TranslateRequest": {
        "type": "object",
        "description": "`POST /brain/translate` and `/v1/translate`: the two-step path of\n`briques/clinique/interprete.py` (the text, then Apertus with the fixed terms of\n`interprete_mots.yaml`, then the number check).",
        "required": [
          "text",
          "to"
        ],
        "properties": {
          "from": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/LangCode",
                "description": "Source language; only French is supported today. Without it, French is assumed (no\ndetection)."
              },
              {
                "type": "null"
              }
            ]
          },
          "text": {
            "$ref": "#/components/schemas/PrivateText",
            "description": "The text to translate."
          },
          "to": {
            "$ref": "#/components/schemas/LangCode",
            "description": "The target language; only English is supported today (any other pair is 422\n`unsupported_language`)."
          }
        },
        "additionalProperties": false
      },
      "TranslateResult": {
        "type": "object",
        "description": "A translation draft.",
        "required": [
          "draft",
          "text",
          "from",
          "to",
          "checks"
        ],
        "properties": {
          "checks": {
            "$ref": "#/components/schemas/TextChecks",
            "description": "The checks; a failed check is shown next to the draft, the text is not altered."
          },
          "draft": {
            "type": "boolean",
            "description": "Always `true`: a staff member reads it before using it."
          },
          "from": {
            "$ref": "#/components/schemas/LangCode",
            "description": "The source language (given or detected)."
          },
          "text": {
            "$ref": "#/components/schemas/PrivateText",
            "description": "The translation."
          },
          "to": {
            "$ref": "#/components/schemas/LangCode",
            "description": "The target language."
          }
        }
      },
      "VerifyReport": {
        "type": "object",
        "description": "The verification result.",
        "required": [
          "records",
          "seals",
          "gaps",
          "bad_seals",
          "anchor_mismatches",
          "torn_tail"
        ],
        "properties": {
          "anchor_mismatches": {
            "type": "array",
            "items": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            },
            "description": "Seals whose anchor copy is missing or differs (by `last_seq`)."
          },
          "bad_seals": {
            "type": "array",
            "items": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            },
            "description": "Seals with a bad signature or range (by `last_seq`)."
          },
          "first_bad_record": {
            "type": [
              "integer",
              "null"
            ],
            "format": "int64",
            "description": "First record whose hash does not match.",
            "minimum": 0
          },
          "gaps": {
            "type": "array",
            "items": {
              "type": "array",
              "items": false,
              "prefixItems": [
                {
                  "type": "integer",
                  "format": "int64",
                  "minimum": 0
                },
                {
                  "type": "integer",
                  "format": "int64",
                  "minimum": 0
                }
              ]
            },
            "description": "Missing `seq` ranges, inclusive."
          },
          "records": {
            "type": "integer",
            "format": "int64",
            "description": "Records read.",
            "minimum": 0
          },
          "seals": {
            "type": "integer",
            "format": "int64",
            "description": "Seals read.",
            "minimum": 0
          },
          "torn_tail": {
            "type": "boolean",
            "description": "A half-written last line (expected after a crash), distinct from tampering."
          }
        }
      },
      "ZoneDeliveryEntry": {
        "type": "object",
        "description": "One line of `GET /zones` `deliveries`.",
        "required": [
          "robot_id",
          "status",
          "robot_online"
        ],
        "properties": {
          "acked_version": {
            "type": [
              "integer",
              "null"
            ],
            "format": "int32",
            "description": "Last version it acknowledged (extra field).",
            "minimum": 0
          },
          "robot_id": {
            "$ref": "#/components/schemas/RobotId",
            "description": "Robot."
          },
          "robot_online": {
            "type": "boolean",
            "description": "Whether the robot is connected now (extra field)."
          },
          "status": {
            "$ref": "#/components/schemas/DeliveryState",
            "description": "State."
          }
        }
      },
      "ZoneId": {
        "type": "string",
        "description": "A deaf or restricted zone.\n\nInvariant: 1 to 64 characters of `[a-z0-9_-]`."
      },
      "ZoneInput": {
        "type": "object",
        "description": "`PUT /zones/{id}`, as the admin console sends it. `id` must equal the path id (else 422).",
        "required": [
          "id",
          "name",
          "floor",
          "kind",
          "polygon"
        ],
        "properties": {
          "floor": {
            "type": "integer",
            "format": "int32",
            "description": "Floor."
          },
          "id": {
            "$ref": "#/components/schemas/ZoneId",
            "description": "Id; must equal the path id."
          },
          "kind": {
            "$ref": "#/components/schemas/ZoneKind",
            "description": "Kind."
          },
          "name": {
            "type": "string",
            "description": "Display name (a label for the zone, never a person's name)."
          },
          "polygon": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "number",
                "format": "double"
              }
            },
            "description": "Vertices in metres, `[x, y]`, y grows south."
          }
        },
        "additionalProperties": false
      },
      "ZoneKind": {
        "type": "string",
        "description": "Kind of zone (C2 `zones.update`).",
        "enum": [
          "deaf",
          "restricted"
        ]
      },
      "ZoneView": {
        "type": "object",
        "description": "A zone as `GET /zones`, `PUT /zones/{id}` and `zone.updated` send it.",
        "required": [
          "id",
          "name",
          "floor",
          "kind",
          "polygon",
          "deliveries",
          "enforced_by_gardien",
          "version"
        ],
        "properties": {
          "deliveries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ZoneDeliveryEntry"
            },
            "description": "Delivery to each robot."
          },
          "enforced_by_gardien": {
            "type": "boolean",
            "description": "`false` for restricted zones for now (architecture.md open question 5)."
          },
          "floor": {
            "type": "integer",
            "format": "int32",
            "description": "Floor."
          },
          "id": {
            "$ref": "#/components/schemas/ZoneId",
            "description": "Id."
          },
          "kind": {
            "$ref": "#/components/schemas/ZoneKind",
            "description": "Kind."
          },
          "name": {
            "type": "string",
            "description": "Display name."
          },
          "polygon": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "number",
                "format": "double"
              }
            },
            "description": "Vertices in metres, `[x, y]`, y grows south."
          },
          "version": {
            "type": "integer",
            "format": "int32",
            "description": "Version, bumped on every change; robots acknowledge it (extra field).",
            "minimum": 0
          }
        }
      }
    },
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  },
  "tags": [
