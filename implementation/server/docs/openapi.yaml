              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          },
          "409": {
            "description": "`not_revertible`, `already_reverted`, `superseded`, `estop_latched` or `robot_offline`",
