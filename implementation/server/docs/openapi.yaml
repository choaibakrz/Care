                "schema": {
                  "$ref": "#/components/schemas/ErrorBody"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearer": []
          }
        ]
      }
    },
    "/brain/summarise": {
      "post": {
        "tags": [
          "brain"
        ],
        "summary": "Summarises notes, messages, documents or transcripts. Every line names its source; a line\nwhose numbers are not in its source is dropped (and counted in `dropped`).",
